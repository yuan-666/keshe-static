<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>售票统计 - 车票管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-title"><i class="bi bi-bar-chart"></i> 售票统计</div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-value" id="totalTickets">0</div>
        <div class="stat-label">总售票数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalClasses">0</div>
        <div class="stat-label">班次总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalCapacity">0</div>
        <div class="stat-label">总容量</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="sellRate">0%</div>
        <div class="stat-label">平均售票率</div>
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">班次售票详情</div>
      <div class="form-group" style="max-width:400px;">
        <label>选择班次</label>
        <select id="classSelect" onchange="loadClassStats()">
          <option value="">请选择班次</option>
        </select>
      </div>
      <div id="classDetail" style="margin-top:16px;"></div>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAdmin()) throw new Error('Not authorized');
    renderSidebar('stats');

    function updateOverview() {
      const tickets = getTickets();
      const classes = getClasses();
      const totalCapacity = classes.reduce((sum, c) => sum + c.capacity, 0);
      document.getElementById('totalTickets').textContent = tickets.length;
      document.getElementById('totalClasses').textContent = classes.length;
      document.getElementById('totalCapacity').textContent = totalCapacity;
      const rate = totalCapacity > 0 ? Math.round(tickets.length / totalCapacity * 100) : 0;
      document.getElementById('sellRate').textContent = rate + '%';
    }

    function loadClassOptions() {
      const select = document.getElementById('classSelect');
      const classes = getClasses();
      select.innerHTML = '<option value="">请选择班次</option>';
      classes.forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls.id;
        opt.textContent = `${cls.id} | ${cls.origin}→${cls.destination} | ${cls.departure}`;
        select.appendChild(opt);
      });
    }

    function loadClassStats() {
      const classId = document.getElementById('classSelect').value;
      const detail = document.getElementById('classDetail');

      if (!classId) {
        detail.innerHTML = '';
        return;
      }

      const cls = getClassById(classId);
      const tickets = getTickets().filter(t => t.classId === classId);
      const remaining = getRemainingSeats(classId);

      let html = `<div style="margin-bottom:16px; padding:12px 16px; background:rgba(26,115,232,0.06); border-radius:8px;">
        <strong>${cls.id}</strong> | ${cls.origin} → ${cls.destination} | 出发：${cls.departure} | 行程：${cls.duration} | 已售：${tickets.length}/${cls.capacity}
      </div>`;

      if (tickets.length === 0) {
        html += '<div class="empty-state"><i class="bi bi-inbox"></i>该班次暂无售票记录</div>';
      } else {
        html += `<div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr><th>票号</th><th>购票人</th><th>座位类型</th><th>购票时间</th></tr>
            </thead>
            <tbody>
              ${tickets.map(t => `<tr>
                <td>${t.id}</td>
                <td>${t.passenger}</td>
                <td><span class="seat-type">${t.seatType}</span></td>
                <td>${t.purchaseTime}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      }

      detail.innerHTML = html;
    }

    updateOverview();
    loadClassOptions();
  </script>
</body>
</html>
