<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退票 - 车票管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-title"><i class="bi bi-arrow-return-left"></i> 退票</div>

    <div class="glass-card">
      <div class="filter-bar">
        <input type="text" id="searchName" placeholder="按购票人姓名搜索" oninput="filterTickets()">
        <select id="filterClass" onchange="filterTickets()">
          <option value="">全部班次</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>票号</th>
              <th>购票人</th>
              <th>购票时间</th>
              <th>班次号</th>
              <th>起点</th>
              <th>终点</th>
              <th>座位</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="ticketBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const isAdmin = localStorage.getItem('admin') === '1';
    const isUser = localStorage.getItem('user') === '1';

    if (!isAdmin && !isUser) {
      window.location.href = 'index.html';
      throw new Error('Not authorized');
    }

    renderSidebar('refund');

    const currentUserId = parseInt(localStorage.getItem('userId') || '0');

    function loadClassFilter() {
      const select = document.getElementById('filterClass');
      const classes = getClasses();
      select.innerHTML = '<option value="">全部班次</option>';
      classes.forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls.id;
        opt.textContent = cls.id + ' ' + cls.origin + '→' + cls.destination;
        select.appendChild(opt);
      });
    }

    function getVisibleTickets() {
      let tickets = getTickets();
      if (!isAdmin) {
        tickets = tickets.filter(t => t.userId === currentUserId);
      }
      return tickets;
    }

    function filterTickets() {
      const searchName = document.getElementById('searchName').value.trim().toLowerCase();
      const filterClass = document.getElementById('filterClass').value;
      let tickets = getVisibleTickets();

      if (searchName) {
        tickets = tickets.filter(t => t.passenger.toLowerCase().includes(searchName));
      }
      if (filterClass) {
        tickets = tickets.filter(t => t.classId === filterClass);
      }

      renderTickets(tickets);
    }

    function renderTickets(tickets) {
      const tbody = document.getElementById('ticketBody');
      if (tickets.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="bi bi-inbox"></i>暂无车票记录</td></tr>';
        return;
      }

      tbody.innerHTML = tickets.map(t => {
        const cls = getClassById(t.classId);
        const canRefundFlag = canRefund(t.classId);
        const status = getClassStatus(t.classId);
        const refundBtn = status === 'departed'
          ? '<span style="color:#999;font-size:12px;">已发车</span>'
          : !canRefundFlag
            ? '<span style="color:#dc3545;font-size:12px;">出发前1小时不可退</span>'
            : `<button class="glass-btn btn-danger btn-sm" onclick="refundTicket('${t.id}')"><i class="bi bi-x-lg"></i> 退票</button>`;

        return `<tr>
          <td>${t.id}</td>
          <td>${t.passenger}</td>
          <td>${t.purchaseTime}</td>
          <td>${t.classId}</td>
          <td>${cls ? cls.origin : '-'}</td>
          <td>${cls ? cls.destination : '-'}</td>
          <td><span class="seat-type">${t.seatType}</span></td>
          <td>${refundBtn}</td>
        </tr>`;
      }).join('');
    }

    function refundTicket(ticketId) {
      if (!confirm('确定要退票吗？')) return;
      let tickets = getTickets();
      const ticket = tickets.find(t => t.id === ticketId);
      if (!ticket) {
        showToast('车票不存在', 'error');
        return;
      }
      if (!canRefund(ticket.classId)) {
        showToast('出发前1小时内不可退票', 'error');
        return;
      }
      tickets = tickets.filter(t => t.id !== ticketId);
      setTickets(tickets);
      showToast('退票成功', 'success');
      filterTickets();
    }

    loadClassFilter();
    filterTickets();
  </script>
</body>
</html>
