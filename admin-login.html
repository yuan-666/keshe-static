<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 车票管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title"><i class="bi bi-shield-lock"></i> 管理员登录</div>
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label>管理员账号</label>
          <input type="text" id="username" placeholder="请输入管理员账号" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <div class="slider-verify" id="sliderVerify">
          <div class="slider-verify-label">滑块验证</div>
          <div class="slider-track">
            <div class="slider-track-fill"></div>
            <div class="slider-track-text">向右拖动滑块验证</div>
            <div class="slider-thumb"><i class="bi bi-chevron-double-right"></i></div>
          </div>
        </div>
        <button type="submit" class="glass-btn" style="width:100%; margin-top:8px;">
          <i class="bi bi-box-arrow-in-right"></i> 登录
        </button>
      </form>
      <div class="login-links">
        <a href="index.html" class="link-primary">用户登录</a>
      </div>
      <div class="test-account-hint">
        <i class="bi bi-info-circle"></i> 测试账号：admin / admin123
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Reset data to defaults on every visit to login page
    initData(true);

    if (localStorage.getItem('admin') === '1') {
      window.location.href = 'classes.html';
    }

    const slider = initSliderVerify('sliderVerify');

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!slider.isVerified()) {
        showToast('请先完成滑块验证', 'error');
        return false;
      }

      const users = getUsers();
      const user = users.find(u => u.username === username && u.password === password && u.role === 'admin');
      if (user) {
        localStorage.setItem('admin', '1');
        localStorage.setItem('username', user.name);
        showToast('登录成功', 'success');
        setTimeout(() => window.location.href = 'classes.html', 600);
      } else {
        showToast('管理员账号或密码错误', 'error');
        slider.reset();
      }
      return false;
    }
  </script>
</body>
</html>
