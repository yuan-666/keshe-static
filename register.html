<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册 - 车票管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title"><i class="bi bi-person-plus"></i> 用户注册</div>
      <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="name" placeholder="请输入真实姓名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
        </div>
        <div class="slider-verify" id="sliderVerify">
          <div class="slider-verify-label">滑块验证</div>
          <div class="slider-track">
            <div class="slider-track-fill"></div>
            <div class="slider-track-text">向右拖动滑块验证</div>
            <div class="slider-thumb"><i class="bi bi-chevron-double-right"></i></div>
          </div>
        </div>
        <button type="submit" class="glass-btn btn-success" style="width:100%; margin-top:8px;">
          <i class="bi bi-check-lg"></i> 注册
        </button>
      </form>
      <div class="login-links">
        <span>已有账号？</span> <a href="index.html" class="link-primary">去登录</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const slider = initSliderVerify('sliderVerify');

    function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!slider.isVerified()) {
        showToast('请先完成滑块验证', 'error');
        return false;
      }

      if (password !== confirmPassword) {
        showToast('两次输入的密码不一致', 'error');
        return false;
      }

      if (password.length < 6) {
        showToast('密码长度不能少于6位', 'error');
        return false;
      }

      const users = getUsers();
      if (users.find(u => u.username === username)) {
        showToast('用户名已存在', 'error');
        return false;
      }

      const newUser = {
        id: users.length + 1,
        username: username,
        password: password,
        role: 'user',
        name: name
      };
      users.push(newUser);
      setUsers(users);

      showToast('注册成功，请登录', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
      return false;
    }
  </script>
</body>
</html>
